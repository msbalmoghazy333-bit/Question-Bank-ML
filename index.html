let currentFilter = 'all';

function renderQuiz() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    let prevCh = null;
    const chapterTitles = {
        1: 'Chapter 1: The Machine Learning Landscape',
        2: 'Chapter 2: End-to-End Machine Learning Project',
        3: 'Chapter 3: Classification',
        4: 'Chapter 4: Training Models (Part I)',
        5: 'Chapter 5: Training Models (Part II)',
        6: 'Chapter 6: Support Vector Machines (SVM)',
        7: 'Chapter 7: Decision Trees (DTs)'
    };

    quizData.forEach((item) => {
        const qId = `q_${item.ch}_${item.num}`;
        
        if (currentFilter !== 'all' && item.ch !== currentFilter) {
            return;
        }

        if (currentFilter === 'all' && item.ch !== prevCh) {
            const divHeader = document.createElement('div');
            divHeader.className = 'chapter-divider';
            divHeader.innerText = chapterTitles[item.ch] || ('Chapter ' + item.ch);
            container.appendChild(divHeader);
            prevCh = item.ch;
        }

        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${qId}`;
        card.setAttribute('data-ch', item.ch);
        card.setAttribute('data-correct', item.correct);

        let optionsHtml = '';
        for (const [key, val] of Object.entries(item.options)) {
            optionsHtml += `
                <label class="option-label" data-value="${key}">
                    <input type="radio" name="${qId}" value="${key}">
                    <span><strong>${key}.</strong> ${val}</span>
                </label>
            `;
        }

        card.innerHTML = `
            <div class="q-header">
                <span class="q-badge">Ch ${item.ch} - Q${item.num}</span>
                <div class="q-text">${item.q}</div>
            </div>
            <div class="options-grid">
                ${optionsHtml}
            </div>
            <div class="explanation" id="exp-${qId}">
                <strong>الشرح والتحليل:</strong> ${item.exp}
            </div>
        `;
        container.appendChild(card);
    });

    updateScoreDisplay();
}

function filterQuestions(filter) {
    currentFilter = filter;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    if (filter === 'all') document.querySelectorAll('.tab-btn')[0].classList.add('active');
    else if (filter === 1) document.querySelectorAll('.tab-btn')[1].classList.add('active');
    else if (filter === 2) document.querySelectorAll('.tab-btn')[2].classList.add('active');
    else if (filter === 3) document.querySelectorAll('.tab-btn')[3].classList.add('active');
    else if (filter === 4) document.querySelectorAll('.tab-btn')[4].classList.add('active');
    else if (filter === 5) document.querySelectorAll('.tab-btn')[5].classList.add('active');
    else if (filter === 6) document.querySelectorAll('.tab-btn')[6].classList.add('active');
    else if (filter === 7) document.querySelectorAll('.tab-btn')[7].classList.add('active');

    renderQuiz();
}

function submitQuiz() {
    let correctCount = 0;
    let answeredCount = 0;
    let totalQuestions = 0;

    quizData.forEach((item) => {
        if (currentFilter !== 'all' && item.ch !== currentFilter) return;

        totalQuestions++;
        const qId = `q_${item.ch}_${item.num}`;
        const card = document.getElementById(`card-${qId}`);
        if (!card) return;

        const labels = card.querySelectorAll('.option-label');
        const checkedInput = card.querySelector(`input[name="${qId}"]:checked`);
        const explanation = document.getElementById(`exp-${qId}`);

        labels.forEach(lbl => lbl.classList.remove('is-correct', 'is-wrong'));

        if (!checkedInput) {
            if (explanation) explanation.style.display = 'none';
            return;
        }

        answeredCount++;

        if (checkedInput.value === item.correct) {
            correctCount++;
            const chosenLabel = card.querySelector(`.option-label[data-value="${checkedInput.value}"]`);
            if (chosenLabel) chosenLabel.classList.add('is-correct');
        } else {
            const wrongLabel = card.querySelector(`.option-label[data-value="${checkedInput.value}"]`);
            if (wrongLabel) wrongLabel.classList.add('is-wrong');
            const correctLabel = card.querySelector(`.option-label[data-value="${item.correct}"]`);
            if (correctLabel) correctLabel.classList.add('is-correct');
        }

        if (explanation) explanation.style.display = 'block';
    });

    const remaining = totalQuestions - answeredCount;
    const scoreDisplay = document.getElementById('scoreDisplay');
    scoreDisplay.innerText = `Answered: ${answeredCount} / ${totalQuestions} (${remaining} Left) | Score: ${correctCount} / ${answeredCount}`;
    scoreDisplay.style.color = answeredCount === 0 ? '#f0f6fc' : ((correctCount / answeredCount) >= 0.7 ? '#3fb950' : '#f85149');
}

function resetQuiz() {
    document.getElementById('quizForm').reset();
    const cards = document.querySelectorAll('.question-card');
    
    cards.forEach(card => {
        const labels = card.querySelectorAll('.option-label');
        labels.forEach(lbl => lbl.classList.remove('is-correct', 'is-wrong'));
        const explanation = card.querySelector('.explanation');
        if (explanation) explanation.style.display = 'none';
    });

    updateScoreDisplay();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateScoreDisplay() {
    const total = currentFilter === 'all' ? 378 : (currentFilter === 1 ? 52 : (currentFilter === 2 ? 59 : (currentFilter === 3 ? 64 : (currentFilter === 4 ? 50 : (currentFilter === 5 ? 51 : (currentFilter === 6 ? 61 : 41))))));
    const scoreDisplay = document.getElementById('scoreDisplay');
    scoreDisplay.innerText = `Answered: 0 / ${total} (${total} Left) | Score: 0 / 0`;
    scoreDisplay.style.color = '#f0f6fc';
}

document.addEventListener('DOMContentLoaded', renderQuiz);
